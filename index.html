<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
    <script src="/assets/main.js" defer></script>
</head>
<body>
    <form action="" novalidate>
        <div class="title">
            <h1>Form Validation</h1>
        </div>

        <div class="controllers">
            <div class="email">
                <label for="email">Email</label>
                <input type="email" name="email" id="email">
                <span class="error" aria-live="polite"></span>
            </div>

            <div class="join">
                <div class="country">
                    <label for="country">Country</label>
                    <select name="country" id="country">
                        <option value="">--Select a country--</option>
                        <option value="fr">France</option>
                        <option value="po">Portugal</option>
                        <option value="so">Spain</option>
                    </select>
                    <span class="error" aria-live="polite"></span>
                </div>
                <div class="postal">
                    <label for="postal">Postal code</label>
                    <input type="text" name="postal" id="postal">
                    <span class="error" aria-live="polite"></span>
                </div>
            </div>

            <div class="password">
                <label for="password">Password</label>
                <input type="password" name="password" id="password">
                <span class="error" aria-live="polite"></span>
            </div>

            <div class="password-confirmation">
                <label for="passconf">Password confirmation</label>
                <input type="password" name="passconf" id="passconf">
                <span class="error" aria-live="polite"></span>
            </div>
        </div>
       
        <div class="submit">
            <input type="submit" value="Submit" name="submit" id="submit">
        </div>
    </form>
</body>
</html>
